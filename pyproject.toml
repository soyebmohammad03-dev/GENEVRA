[project]
name = "genevra"
version = "0.1.0"
description = "A research laboratory for open-ended evolution, evolvability, and adaptive intelligence in digital organisms."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Soyeb Mohammad" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
]
viz = ["matplotlib>=3.8"]

[project.scripts]
genevra = "genevra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genevra"]

[tool.hatch.build.targets.wheel.force-include]
"experiments/baseline.py" = "genevra/experiments/_scripts/baseline.py"
"experiments/exp1_isolated_vs_shared.py" = "genevra/experiments/_scripts/exp1_isolated_vs_shared.py"
"experiments/exp_ecology_corrected.py" = "genevra/experiments/_scripts/exp_ecology_corrected.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/experiments/baseline.py", "/experiments/exp1_isolated_vs_shared.py",
  "/experiments/exp_ecology_corrected.py", "/README.md", "/LICENSE", "/CITATION.cff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/genevra"]
