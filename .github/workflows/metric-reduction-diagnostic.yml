name: Metric reduction diagnostic
on:
  push:
    branches: [research/publication-development]
    paths:
      - scripts/diagnose_metric_reductions.py
      - .github/workflows/metric-reduction-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - run: python -m pip install . numpy==2.5.4
      - run: python scripts/diagnose_metric_reductions.py "$RUNNER_TEMP/norms.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-metric-norms
          path: ${{ runner.temp }}/norms.json
